<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playground Signature</title></head><body><main style="max-width:520px;margin:5rem auto;font:16px system-ui"><h1>Test Signature — $0</h1><p>Training only. No legal effect. Identity not biometrically verified.</p><p id="status">Loading…</p><p id="doc"></p><input id="name" placeholder="Type recipient name"><label><input type="checkbox" id="ok"> I reviewed and consent to record a test signature</label><p><button id="submit">Record test signature</button></p></main><script>
const token=new URLSearchParams(location.search).get('token'),url='https://swabdflpuvhsrqktvbaa.supabase.co/functions/v1/tc-playground-signing';
const status=document.getElementById('status');
async function request(action,extra){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error);return d}
request('review').then(d=>{document.getElementById('doc').textContent=d.document;status.textContent='Expires '+new Date(d.expires_at).toLocaleString()}).catch(e=>status.textContent=e.message);
document.getElementById('submit').onclick=async()=>{if(!document.getElementById('ok').checked){status.textContent='Consent required';return}try{const d=await request('sign',{typed_name:document.getElementById('name').value,confirm:true});status.textContent='Test signed '+d.completed_at;document.getElementById('submit').disabled=true;history.replaceState({},'','/sign-test.html')}catch(e){status.textContent=e.message}};
</script></body></html>
