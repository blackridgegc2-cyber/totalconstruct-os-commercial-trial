name: Project Budget Import Regression
on:
  push:
    branches: [fix-document-project-intake, main]
    paths:
      - 'r1-project-budget-import-core.cjs'
      - 'api/budget-preview.js'
      - 'tests/project-budget-import.test.cjs'
      - '.github/workflows/project-budget-import.yml'
  pull_request:
    paths:
      - 'r1-project-budget-import-core.cjs'
      - 'api/budget-preview.js'
      - 'tests/project-budget-import.test.cjs'
      - '.github/workflows/project-budget-import.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/project-budget-import.test.cjs
